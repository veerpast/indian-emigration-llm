name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: ruff check scripts tests
      - run: pytest -q
      - name: Check presentation assets
        run: test -s dist/index.html && test -s dist/assets/styles.css && test -s dist/assets/app.js

